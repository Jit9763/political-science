<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>नोट्स (छात्र कॉपी संस्करण)</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            overflow-x: auto !important;
        }
        .container {
            max-width: none !important;
            width: fit-content !important;
            min-width: 100% !important;
            margin: 0 auto !important;
            padding: 0 0 40px 0 !important;
        }
        .page-container {
            width: var(--container-width, 1400px) !important;
            max-width: none !important;
            margin: 15px auto;
            background: white;
            color: #1a202c;
            padding: 10px !important;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            text-align: justify;
        }
        #notes-content > div,
        #notes-content .ch1-content,
        #notes-content .ch2-content,
        #notes-content .master-container,
        #notes-content .preview {
            padding-left: 5px !important;
            padding-right: 5px !important;
        }
        @media (max-width: 1400px) {
            .page-container {
                max-width: 100%;
            }
        }
        .nav-back {
            margin-bottom: 20px;
            display: inline-block;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 100px;
            font-size: 1.5rem;
        }

        /* Action Bar for Copy/Print */
        .action-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1100;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: calc(100% - 40px);
        }

        .action-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: 2px solid #3b82f6;
            background: #1e293b;
            color: white;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .action-btn:hover {
            transform: scale(1.1);
            background: #3b82f6;
        }

        #notes-content .adjustable-text {
            font-size: max(2px, calc(var(--orig-size) + var(--size-offset, 0px))) !important;
            font-weight: calc(var(--orig-weight) + var(--weight-offset, 0)) !important;
            -webkit-text-stroke-width: max(0px, calc(var(--orig-stroke, 0px) + var(--stroke-offset, 0px))) !important;
            -webkit-text-stroke-color: #000000 !important;
        }

        .btn-copy.success {
            background: #059669;
            border-color: #10b981;
        }

        @media print {
            .bg-animation, 
            .floating-home-btn, 
            .action-bar {
                display: none !important;
            }
            body { 
                background: white !important; 
                margin: 0; 
                padding: 0;
            }
            .container {
                padding: 0;
                margin: 0;
            }
            .page-container {
                width: 100% !important;
                max-width: none !important;
                box-shadow: none !important;
                margin: 0 !important;
                padding: 20px !important;
                border-radius: 0 !important;
                background: white !important;
            }
            #notes-content {
                margin-top: 0 !important;
            }
        }
        /* Prevent images and containers from overflowing */
        * {
            box-sizing: border-box;
        }
        #notes-content {
            margin-top: 80px;
        }
        #notes-content img {
            max-width: 100%;
            height: auto;
        }

        /* ==========================================================================
           CRITICAL OVERRIDES: Convert Projector Styles to Student Copy-Down Format
           ========================================================================== */
        #notes-content div, 
        #notes-content p, 
        #notes-content li, 
        #notes-content span,
        #notes-content ul,
        #notes-content ol {
            font-size: 16pt !important;
            font-weight: normal !important;
            color: #1a202c !important;
            line-height: 1.8 !important;
        }
        #notes-content h1 {
            font-size: 26pt !important;
            color: #1e3a8a !important;
            font-weight: bold !important;
        }
        #notes-content h2 {
            font-size: 20pt !important;
            color: #1e3a8a !important;
            font-weight: bold !important;
        }
        #notes-content h3 {
            font-size: 16pt !important;
            color: #1e3a8a !important;
            font-weight: bold !important;
        }
        /* Style biography boxes to be compact and space-saving */
        #notes-content .bio-box {
            display: flex !important;
            padding: 15px !important;
            margin: 15px 0 !important;
            border: 2px solid #cbd5e1 !important;
            background-color: #f8fafc !important;
            border-radius: 8px !important;
            gap: 15px !important;
            align-items: center !important;
        }
        #notes-content .bio-img-container {
            flex: 0 0 90px !important;
        }
        #notes-content .bio-img {
            width: 80px !important;
            border: 2px solid #000000 !important;
        }
        #notes-content .bio-text p {
            font-size: 13pt !important;
            line-height: 1.5 !important;
            font-weight: normal !important;
            color: #1a202c !important;
        }
        #notes-content .bio-text h3 {
            font-size: 16pt !important;
            font-weight: bold !important;
            margin: 0 0 5px 0 !important;
            color: #1e3a8a !important;
        }

        /* Style illustrations and cartoons to be visible but compact */
        #notes-content .illustration-box {
            display: block !important;
            border: 2px solid #cbd5e1 !important;
            background-color: #ffffff !important;
            border-radius: 8px !important;
            padding: 12px !important;
            margin: 20px 0 !important;
        }
        #notes-content .illustration-img {
            max-width: 75% !important;
            border: 3px solid #000000 !important;
            border-radius: 6px !important;
        }
        #notes-content .illustration-explanation {
            display: block !important;
            font-size: 12pt !important;
            line-height: 1.5 !important;
            color: #4b5563 !important;
            padding: 10px !important;
            margin-top: 8px !important;
            border-left: 4px solid #3b82f6 !important;
            background-color: #f3f4f6 !important;
            border-radius: 4px !important;
        }
        #notes-content .illustration-explanation b {
            font-weight: bold !important;
            color: #1f2937 !important;
        }
        #notes-content img {
            max-width: 100% !important;
            height: auto !important;
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="container" style="position: relative;">
        <!-- Floating Home Button -->
        <a href="index.html" class="floating-home-btn" style="position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: #1e293b; color: white; width: 45px; height: 45px; border-radius: 50%; text-decoration: none; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 2px solid #3b82f6; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: all 0.3s ease;">🏠</a>
        
        <div class="page-container" style="position: relative;">
            <div class="action-bar">
                <button class="action-btn" onclick="adjustWidth(40)" title="Increase Page Width" style="font-family: 'Outfit', sans-serif; font-weight: 600;">W+</button>
                <button class="action-btn" onclick="adjustWidth(-40)" title="Decrease Page Width" style="font-family: 'Outfit', sans-serif; font-weight: 600;">W-</button>
                <button class="action-btn" onclick="adjustFontSize(2)" title="Increase Font Size" style="font-family: 'Outfit', sans-serif; font-weight: 600;">A+</button>
                <button class="action-btn" onclick="adjustFontSize(-2)" title="Decrease Font Size" style="font-family: 'Outfit', sans-serif; font-weight: 600;">A-</button>
                <button class="action-btn" onclick="adjustFontWeight(100)" title="Increase Text Boldness" style="font-family: 'Outfit', sans-serif; font-weight: 600;">B+</button>
                <button class="action-btn" onclick="adjustFontWeight(-100)" title="Decrease Text Boldness" style="font-family: 'Outfit', sans-serif; font-weight: 600;">B-</button>
                <button id="floatingCopyBtn" class="action-btn btn-copy" onclick="copyEntireContent()" title="Copy for Google Docs">📋</button>
                <button class="action-btn" onclick="window.print()" title="Print / Save as PDF">🖨️</button>
            </div>

            <div id="notes-content">
                <div class="loading">नोट्स लोड हो रहे हैं... (50 पन्ने)</div>
            </div>
        </div>
    </div>

    <script>
        let containerWidth = 1400; // default width in pixels

        function adjustWidth(amount) {
            containerWidth += amount;
            if (containerWidth < 300) containerWidth = 300;
            if (containerWidth > 6000) containerWidth = 6000;
            const container = document.querySelector('.page-container');
            if (container) {
                container.style.setProperty('--container-width', containerWidth + 'px');
                container.style.setProperty('width', containerWidth + 'px', 'important');
                container.style.setProperty('max-width', 'none', 'important');
            }
        }

        document.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
            if (e.key === 'w' || e.key === 'W') {
                if (e.shiftKey) {
                    adjustWidth(40);
                } else {
                    adjustWidth(-40);
                }
            } else if (e.key === '+' || e.key === '=') {
                adjustWidth(40);
            } else if (e.key === '-') {
                adjustWidth(-40);
            }
        });

        let sizeOffset = 0;
        let weightOffset = 0;
        let strokeOffset = 0;

        function adjustFontSize(amount) {
            sizeOffset += amount;
            if (sizeOffset < -45) sizeOffset = -45;
            if (sizeOffset > 60) sizeOffset = 60;
            const container = document.getElementById('notes-content');
            if (container) {
                container.style.setProperty('--size-offset', sizeOffset + 'px');
            }
        }

        function adjustFontWeight(amount) {
            weightOffset += amount;
            if (weightOffset < -600) weightOffset = -600;
            if (weightOffset > 800) weightOffset = 800;
            
            strokeOffset += (amount / 100) * 0.4;
            if (strokeOffset < -3.0) strokeOffset = -3.0;
            if (strokeOffset > 5.0) strokeOffset = 5.0;
            
            const container = document.getElementById('notes-content');
            if (container) {
                container.style.setProperty('--weight-offset', weightOffset);
                container.style.setProperty('--stroke-offset', strokeOffset + 'px');
            }
        }

        function initTextFormatting(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const elements = container.querySelectorAll('*');
            elements.forEach(el => {
                const tagName = el.tagName.toLowerCase();
                if (['script', 'style', 'img', 'br', 'hr'].includes(tagName)) return;
                
                const style = window.getComputedStyle(el);
                const fontSize = style.fontSize;
                const fontWeight = style.fontWeight;
                const strokeWidth = style.webkitTextStrokeWidth;
                
                if (fontSize) {
                    el.style.setProperty('--orig-size', fontSize);
                }
                if (fontWeight) {
                    let weightVal = fontWeight;
                    if (fontWeight === 'normal') weightVal = '400';
                    else if (fontWeight === 'bold') weightVal = '700';
                    el.style.setProperty('--orig-weight', weightVal);
                }
                if (strokeWidth && strokeWidth !== '0px' && strokeWidth !== '') {
                    el.style.setProperty('--orig-stroke', strokeWidth);
                }
                el.classList.add('adjustable-text');
            });
        }

        async function copyEntireContent() {
            const btn = document.getElementById('floatingCopyBtn');
            const target = document.getElementById('notes-content');
            
            // Clone the content to modify it for copying
            const clone = target.cloneNode(true);
            
            // Revert adjustable styles in the clone to make it clean for Google Docs
            const adjustableElements = clone.querySelectorAll('.adjustable-text');
            adjustableElements.forEach(el => {
                const origSize = el.style.getPropertyValue('--orig-size');
                const origWeight = el.style.getPropertyValue('--orig-weight');
                const origStroke = el.style.getPropertyValue('--orig-stroke');
                if (origSize) {
                    el.style.fontSize = origSize;
                } else {
                    el.style.removeProperty('font-size');
                }
                if (origWeight) {
                    el.style.fontWeight = origWeight;
                } else {
                    el.style.removeProperty('font-weight');
                }
                if (origStroke) {
                    el.style.webkitTextStrokeWidth = origStroke;
                } else {
                    el.style.removeProperty('-webkit-text-stroke-width');
                    el.style.removeProperty('-webkit-text-stroke-color');
                }
                el.style.removeProperty('--orig-size');
                el.style.removeProperty('--orig-weight');
                el.style.removeProperty('--orig-stroke');
                el.classList.remove('adjustable-text');
            });

            // Convert relative image paths to Absolute URLs for Docs sync
            const images = clone.querySelectorAll('img');
            images.forEach(img => {
                img.setAttribute('src', img.src);
            });

            const content = clone.innerHTML;
            
            try {
                const blob = new Blob([content], { type: 'text/html' });
                const item = new ClipboardItem({ 'text/html': blob });
                await navigator.clipboard.write([item]);
                
                btn.innerText = '✅';
                btn.classList.add('success');
                
                setTimeout(() => {
                    btn.innerText = '📋';
                    btn.classList.remove('success');
                }, 3000);
            } catch (err) {
                alert('Copy failed: ' + err);
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (id && parseInt(id) >= 1 && parseInt(id) <= 15) {
                try {
                    const response = await fetch(`copy_master_ch${id}.html`);
                    if (!response.ok) throw new Error('File not found');
                    
                    const html = await response.text();
                    
                    // Extract only the content inside #contentToCopy
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const content = doc.getElementById('contentToCopy');
                    
                    if (content) {
                        // Append style tags from the fetched copy master to document.head
                        const styleTags = doc.querySelectorAll('style');
                        styleTags.forEach(style => {
                            document.head.appendChild(style.cloneNode(true));
                        });
                        
                        document.getElementById('notes-content').innerHTML = content.innerHTML;
                        document.title = "नोट्स - चैप्टर " + id;
                        initTextFormatting('notes-content');
                    } else {
                        document.getElementById('notes-content').innerHTML = "<p>त्रुटि: नोट्स प्राप्त नहीं हो सके।</p>";
                    }
                } catch (err) {
                    document.getElementById('notes-content').innerHTML = `<p>त्रुटि: चैप्टर ${id} के नोट्स अभी उपलब्ध नहीं हैं।</p>`;
                }
            } else {
                document.getElementById('notes-content').innerHTML = "<h3>चैप्टर " + (id || "") + " के लिए नोट्स जल्द ही आ रहे हैं!</h3>";
            }

            // Floating Home Button Auto-Hide Logic
            let lastScrollY = window.scrollY;
            const homeBtn = document.querySelector('.floating-home-btn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50 && window.scrollY > lastScrollY) {
                    homeBtn.style.opacity = '0';
                    homeBtn.style.transform = 'scale(0.8) translateY(50px)';
                    homeBtn.style.pointerEvents = 'none';
                } else {
                    homeBtn.style.opacity = '1';
                    homeBtn.style.transform = 'scale(1) translateY(0)';
                    homeBtn.style.pointerEvents = 'auto';
                }
                lastScrollY = window.scrollY;
            });
        });
    </script>
</body>
</html>
