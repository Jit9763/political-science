name: Daily RPSC RAS & UPSC AI Notes Generator (Cloud Automation)

on:
  schedule:
    # Multiple offset cron triggers (IST: 11:15 AM, 11:45 AM, 12:05 PM) to bypass GitHub Actions runner queue congestion
    - cron: '45 5 * * *'
    - cron: '15 6 * * *'
    - cron: '35 6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  generate_notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 google-genai python-docx python-dotenv youtube-transcript-api customtkinter ollama

    - name: Run Daily News & Master Syllabus AI Agent
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TZ: "Asia/Kolkata"
      run: |
        python RPSC_UPSC_Daily_AI_Agent/auto_daily_runner.py

    - name: Commit & Push Generated Notes & Master Wiki
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git pull --rebase origin main || true
        git add -A RPSC_UPSC_Daily_AI_Agent/Output_Notes/ RPSC_UPSC_Daily_AI_Agent/Master_Library/
        git diff --staged --quiet || (git commit -m "Auto-generate Daily RAS UPSC Notes & Master Wiki [skip ci]" && git push origin main)
