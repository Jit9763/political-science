name: Daily RPSC RAS & UPSC AI Notes Generator (Cloud Automation)

on:
  schedule:
    # Runs daily at 12:00 PM IST (06:30 AM UTC)
    - cron: '30 6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  generate_notes:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 google-genai python-docx python-dotenv youtube-transcript-api customtkinter ollama

    - name: Run Daily News & Master Syllabus AI Agent
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python RPSC_UPSC_Daily_AI_Agent/main_agent.py --no-browser

    - name: Commit & Push Generated Notes & Master Wiki
      run: |
        git config --global user.name 'RAS-UPSC-AI-Agent-Bot'
        git config --global user.email 'ai-bot@users.noreply.github.com'
        git add RPSC_UPSC_Daily_AI_Agent/Output_Notes/ RPSC_UPSC_Daily_AI_Agent/Master_Library/ || true
        git commit -m "Auto-generate Daily RAS UPSC Notes & Master Syllabus Wiki [skip ci]" || true
        git push || true
