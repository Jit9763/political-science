<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A - प्रीमियम HTML व्यू</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .page-container {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 20px;
            background: transparent;
        }
        .nav-back {
            margin-bottom: 20px;
            display: inline-block;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 100px;
            font-size: 1.5rem;
            color: white;
        }

        /* Floating Sidebar for Actions - NOW SCROLLABLE (Absolute) */
        .sidebar-actions {
            position: absolute;
            right: 20px;
            top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 2000;
        }
        .tool-btn {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        .tool-btn:hover { transform: scale(1.1); filter: brightness(1.1); }
        
        .copy-tool { background: #059669; }
        .pdf-tool { background: #be123c; }

        /* Print Styles to ensure PDF is PERFECT on A4 */
        @page {
            margin: 10mm;
            size: A4;
        }
        @media print {
            .bg-animation, .sidebar-actions, .floating-home-btn, .nav-back { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .page-container { padding: 0 !important; width: 100% !important; max-width: 100% !important; }
            .master-container { width: 100% !important; margin: 0 !important; padding: 10mm !important; border: none !important; box-shadow: none !important; background-color: white !important; }
            .qa-block { page-break-inside: avoid; border: 1px solid #eee !important; margin-bottom: 20px !important; }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="container" style="position: relative; width: 100%;">
        <!-- Sidebar Tools at TOP RIGHT -->
        <div class="sidebar-actions">
            <button id="copyBtn" class="tool-btn copy-tool" onclick="copyEntireContent()" title="Copy Formatting">📋</button>
            <button id="pdfBtn" class="tool-btn pdf-tool" onclick="generatePDF()" title="Download PDF or Print">📥</button>
        </div>
        
        <!-- Floating Home Button at BOTTOM LEFT -->
        <a href="index.html" class="floating-home-btn" style="position: fixed; bottom: 30px; left: 30px; z-index: 1000; background: #1e293b; color: white; padding: 15px; border-radius: 50%; text-decoration: none; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.3); border: 2px solid #059669; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; width: 65px; height: 65px;">🏠</a>

        <div class="page-container">
            <div id="notes-content">
                <div class="loading">Q&A लोड हो रहे हैं... (शामिल हैं 30 प्रश्न)</div>
            </div>
        </div>
    </div>

    <script>
        async function copyEntireContent() {
            const btn = document.getElementById('copyBtn');
            const target = document.getElementById('notes-content');
            
            // Get all styles to preserve formatting
            const styles = Array.from(document.querySelectorAll('style'))
                .map(s => s.innerHTML)
                .join('\n');

            const richHTML = `<!DOCTYPE html><html><head><style>${styles}</style></head>
            <body><div class="master-container" style="padding: 20px;">${target.innerHTML}</div></body></html>`;

            try {
                const blob = new Blob([richHTML], { type: 'text/html' });
                const item = new ClipboardItem({ 'text/html': blob });
                await navigator.clipboard.write([item]);
                
                btn.innerText = '✅';
                setTimeout(() => btn.innerText = '📋', 2000);
            } catch (err) {
                alert('Copy failed: ' + err);
            }
        }

        function generatePDF() {
            // Using browser native print for 100% fidelity
            window.print();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (id && parseInt(id) >= 1 && parseInt(id) <= 20) {
                try {
                    const response = await fetch(`qa_master_ch${id}.html?v=${new Date().getTime()}`);
                    if (!response.ok) throw new Error('File not found');
                    
                    const html = await response.text();
                    
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    // Extract styles from fetched chapter
                    const styles = doc.querySelectorAll('style');
                    styles.forEach(style => {
                        document.head.appendChild(style.cloneNode(true));
                    });

                    // Extract content
                    const content = doc.getElementById('contentToCopy');
                    if (content) {
                        document.getElementById('notes-content').innerHTML = content.innerHTML;
                        document.title = "Q&A - चैप्टर " + id;
                    } else {
                        document.getElementById('notes-content').innerHTML = "<p>त्रुटि: Q&A प्राप्त नहीं हो सके।</p>";
                    }
                } catch (err) {
                    document.getElementById('notes-content').innerHTML = `<p>त्रुटि: चैप्टर ${id} के Q&A अभी उपलब्ध नहीं हैं।</p>`;
                }
            } else {
                document.getElementById('notes-content').innerHTML = "<h3>चैप्टर " + (id || "") + " के लिए Q&A व्यू जल्द ही आ रहा है!</h3><p>कृपया अभी के लिए अन्य चैप्टर्स को आज़माएँ।</p>";
            }
        });
    </script>
    </script>
</body>
</html>
